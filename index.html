<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyclist Power & Speed Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #1867c0;
      --secondary: #f0f4fb;
      --accent: #eaf1fb;
      --border: #bfd6ee;
      --danger: #d32f2f;
      font-size: 16px;
    }
    html, body { margin: 0; padding: 0; background: var(--secondary);}
    body { min-height: 100vh; font-family: system-ui,sans-serif;}
    header {
      background: var(--primary);
      color: #fff;
      text-align: center;
      font-weight: 600;
      letter-spacing: .03em;
      font-size: 1.6rem;
      padding: 1.1rem 0 .8rem 0;
      border-radius: 0 0 2rem 2rem;
      box-shadow: 0 4px 12px #1867c011;
    }
    main {
      max-width: 510px;
      margin: 2.2rem auto 0 auto;
      background: #fff;
      border-radius: 1.1rem;
      box-shadow: 0 4px 24px #1867c01b;
      padding: 2.1rem 1.6rem 1rem 1.6rem;
      min-height: 63vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    form { display: flex; flex-direction: column; gap: 1.2rem; margin-bottom: 1.6rem;}
    .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center;}
    label { flex: 1 0 112px; font-size: 1.06rem;}
    input[type="number"], select {
      flex: 1 0 80px;
      padding: .5rem;
      border-radius: .5rem;
      border: 1px solid var(--border);
      font-size: 1.07rem;
      background: var(--accent);
    }
    input[type="checkbox"] { width: 1.2rem; height: 1.2rem;}
    button {
      padding: 0.9rem 1.7rem;
      font-size: 1.15rem;
      border-radius: 0.7rem;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.3rem;
      transition: background .16s;
    }
    button:disabled { background: #bbb; cursor: not-allowed;}
    #live-stats, #settings-summary {
      background: var(--accent);
      border-radius: 0.7rem;
      margin-bottom: 1.2rem;
      padding: .9rem 1rem .7rem 1rem;
      font-size: 1.08rem;
      border-left: 4px solid var(--primary);
      word-break: break-word;
    }
    #live-stats strong { color: var(--primary);}
    #summary, #csv-download { margin-top: 1.5rem; font-size: 1.06rem;}
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.04rem;
      margin-top: 0.8rem;
    }
    th, td {
      border: 1px solid #dbe7f9;
      padding: 0.47rem 0.7rem;
      text-align: left;
    }
    th { background: var(--accent);}
    .danger { color: var(--danger); font-weight: bold;}
    .current-cda { font-weight: bold; color: #1867c0;}
    @media (max-width: 650px) {
      main { padding: 1.1rem .3rem .5rem .3rem;}
      table, th, td { font-size: 0.97rem;}
      label { font-size: 1rem;}
      button { font-size: 1rem; padding: 0.7rem 1.1rem;}
    }
    @media (max-width: 420px) {
      main { padding: .3rem .03rem .3rem .03rem;}
      th, td { font-size: .93rem;}
    }
  </style>
</head>
<body>
<header>Cyclist Power & Speed Tracker</header>
<main>
  <form id="settings" autocomplete="off">
    <div class="row">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="simulate">Simulate</option>
        <option value="gps">Use GPS</option>
      </select>
      <label for="auto_pose" style="flex:2 0 100px;">
        <input type="checkbox" id="auto_pose" checked> Auto Pose
      </label>
    </div>
    <div class="row">
      <label>Rider mass (kg):</label>
      <input type="number" id="rider_mass" value="70" min="30" max="120" step="1">
      <label>Bike mass (kg):</label>
      <input type="number" id="bike_mass" value="8" min="5" max="20" step="0.1">
    </div>
    <div class="row">
      <label for="cda">CdA (m²):</label>
      <input type="number" id="cda" value="0.3" min="0.2" max="0.5" step="0.01">
      <label for="crr">CRR:</label>
      <input type="number" id="crr" value="0.004" min="0.002" max="0.01" step="0.0001">
    </div>
    <button type="button" id="start-btn">Start Session</button>
    <button type="button" id="stop-btn" disabled>Stop Session</button>
  </form>
  <div id="settings-summary"></div>
  <div id="live-stats"></div>
  <div id="summary"></div>
  <div id="csv-download"></div>
</main>
<script>
  // --- Constants & Globals ---
  const g = 9.80665, rho = 1.225, efficiency = 0.23;
  let dataPoints = [], intervalHandles = [], running = false, lastTimestamp = null;
  let currentWind = {speed: 0, direction: 0}, currentCdA = 0.3, positions = [];

  // --- Utilities ---
  function toCSV(rows) {
    const header = ['timestamp','latitude','longitude','altitude','power','speed','cda','gradient'];
    const csv = [header.join(',')];
    for (const r of rows) {
      csv.push([r.timestamp, r.lat, r.lon, r.alt, r.power, r.speed, r.cda, r.gradient].join(','));
    }
    return csv.join('\n');
  }
  function haversine(lat1, lon1, lat2, lon2) {
    const toRad = x => x * Math.PI/180, R = 6371000;
    const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function bearing(lat1, lon1, lat2, lon2) {
    const toRad = x => x * Math.PI/180, toDeg = x => x * 180/Math.PI;
    const dLon = toRad(lon2-lon1), y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }
  async function getWind(lat, lon) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&windspeed_unit=ms`;
    try {
      const res = await fetch(url); const js = await res.json();
      if (js.current_weather)
        return {speed: js.current_weather.windspeed, direction: js.current_weather.winddirection};
    } catch (e) {}
    return {speed: 0, direction: 0};
  }
  async function getElevation(lat, lon) {
    const url = `https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`;
    try {
      const res = await fetch(url); const js = await res.json();
      if (js.elevation) return js.elevation;
    } catch (e) {}
    return 0;
  }
  function simulatePosition(baseLat, baseLon, metersEast, metersNorth) {
    const dLat = metersNorth/111320, dLon = metersEast/(40075000*Math.cos(baseLat*Math.PI/180)/360);
    return [baseLat + dLat, baseLon + dLon];
  }
  function autoPoseCdA(gradient) {
    if (gradient > 0.03) return 0.40;      // climbing, upright or out of saddle
    if (gradient < -0.03) return 0.28;     // descent, drops
    return 0.32;                           // flat, hoods
  }
  function calcPower(p1, p2, wind, user, useAutoPose) {
    const dist = haversine(p1.lat, p1.lon, p2.lat, p2.lon);
    const dt = (p2.timestamp - p1.timestamp)/1000;
    if (dt <= 0) return {power: 0, speed: 0, cda: user.cda, gradient: 0};
    const speed = dist / dt;
    const dAlt = p2.alt - p1.alt;
    const gradient = dist < 1 ? 0 : dAlt / dist;
    const theta = Math.atan(gradient);
    const course = bearing(p1.lat, p1.lon, p2.lat, p2.lon);
    const wind_rel = wind.speed * Math.cos((wind.direction - course) * Math.PI/180);
    const apparent_speed = speed + wind_rel;
    let cda = user.cda;
    if (useAutoPose) cda = autoPoseCdA(gradient);
    const mass = user.rider_mass + user.bike_mass;
    const F_gravity = mass * g * Math.sin(theta);
    const F_roll = mass * g * user.crr * Math.cos(theta);
    const F_aero = 0.5 * rho * cda * apparent_speed**2;
    const totalF = F_gravity + F_roll + F_aero;
    const power = totalF * speed;
    return {power: Math.max(0, power), speed: speed, cda: cda, gradient: gradient};
  }

  // --- Main Session Logic ---
  function startSession(user, useAutoPose) {
    running = true; dataPoints = []; positions = [];
    lastTimestamp = Date.now();
    document.getElementById('summary').textContent = "";
    document.getElementById('csv-download').textContent = "";
    document.getElementById('start-btn').disabled = true;
    document.getElementById('stop-btn').disabled = false;
    document.getElementById('live-stats').innerHTML = `<span class="danger">Session started. Awaiting data ...</span>`;
    let baseLat = 51.05011, baseLon = -114.08529, metersEast = 0, metersNorth = 0;
    let watchId = null;
    function stopWatch() { if (watchId !== null) navigator.geolocation.clearWatch(watchId);}
    // Every 5s: get pos/elev/wind and compute
    intervalHandles.push(setInterval(async () => {
      const now = Date.now();
      let lat, lon, alt;
      if (user.mode === "simulate") {
        metersEast += 4 + (Math.random() - 0.5)*0.8;
        metersNorth += (Math.random() - 0.5)*0.3;
        [lat, lon] = simulatePosition(baseLat, baseLon, metersEast, metersNorth);
        alt = 1050 + Math.sin(metersEast/200)*8 + Math.random();
      } else if (positions.length > 0) {
        const pos = positions[positions.length-1];
        lat = pos.coords.latitude;
        lon = pos.coords.longitude;
        alt = await getElevation(lat, lon);
      } else {
        document.getElementById('live-stats').innerHTML = `<span class="danger">Waiting for GPS position ...</span>`;
        return;
      }
      currentWind = await getWind(lat, lon);
      let prev = dataPoints.length > 0 ? dataPoints[dataPoints.length-1] : {lat, lon, alt, timestamp: now-5000};
      const {power, speed, cda, gradient} = calcPower(prev, {lat, lon, alt, timestamp: now}, currentWind, user, useAutoPose);
      currentCdA = cda;
      dataPoints.push({
        timestamp: now, lat, lon, alt, power, speed, cda, gradient
      });
      updateStatsDisplay();
    }, 5000));
    // For GPS: collect positions
    if (user.mode === "gps" && navigator.geolocation) {
      watchId = navigator.geolocation.watchPosition(
        pos => positions.push(pos),
        err => document.getElementById('live-stats').innerHTML =
          `<span class="danger">GPS error: ${err.message}</span>`,
        {enableHighAccuracy: true, maximumAge: 4000, timeout: 10000}
      );
    }
    // Attach stop handler
    document.getElementById('stop-btn').onclick = () => {
      running = false; stopWatch();
      for (const h of intervalHandles) clearInterval(h);
      intervalHandles = [];
      document.getElementById('start-btn').disabled = false;
      document.getElementById('stop-btn').disabled = true;
      showSummary(user);
    };
  }

  function updateStatsDisplay() {
    if (dataPoints.length < 2) return;
    const recent = dataPoints.slice(-1);
    const avgPower = recent.reduce((s,r)=>s+r.power,0)/recent.length;
    const avgSpeed = recent.reduce((s,r)=>s+r.speed,0)/recent.length;
    const grad = recent[0].gradient*100;
    document.getElementById('live-stats').innerHTML = `
      <strong>Current (last 5s):</strong><br>
      Power: ${avgPower.toFixed(1)} W<br>
      Speed: ${(avgSpeed*3.6).toFixed(1)} km/h<br>
      Gradient: ${grad.toFixed(1)}%<br>
      Wind: ${currentWind.speed.toFixed(1)} m/s at ${currentWind.direction.toFixed(0)}°
      <br>CdA: <span class="current-cda">${currentCdA.toFixed(2)} m²</span>
    `;
  }

  function showSummary(user) {
    const clean = dataPoints.filter(r=>r.power && r.speed && !isNaN(r.power) && !isNaN(r.speed));
    if (clean.length === 0) return;
    const avgPower = clean.reduce((s,r)=>s+r.power,0)/clean.length;
    const avgSpeed = clean.reduce((s,r)=>s+r.speed,0)/clean.length;
    const totalJoules = clean.reduce((s,r,i,arr)=>{
      if (i===0) return s;
      const dt = (r.timestamp - arr[i-1].timestamp)/1000;
      return s + r.power*dt;
    }, 0);
    const calories = totalJoules / efficiency / 4184;
    let totalElev = 0;
    for (let i=1; i<clean.length; ++i) {
      const d = clean[i].alt - clean[i-1].alt;
      if (d > 0.3) totalElev += d;
    }
    document.getElementById('summary').innerHTML = `
      <h3>Session Summary</h3>
      <table>
        <tr><th>Average Power</th><td>${avgPower.toFixed(1)} W</td></tr>
        <tr><th>Average Speed</th><td>${(avgSpeed*3.6).toFixed(1)} km/h</td></tr>
        <tr><th>Total Calories</th><td>${calories.toFixed(1)} kcal</td></tr>
        <tr><th>Total Elevation Gain</th><td>${totalElev.toFixed(1)} m</td></tr>
      </table>
    `;
    const csv = toCSV(clean);
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    document.getElementById('csv-download').innerHTML =
      `<a href="${url}" download="session.csv">Download session CSV</a>`;
  }

  // --- UI Handlers ---
  function updateSettingsSummary() {
    const cda = parseFloat(document.getElementById('cda').value);
    const autoPose = document.getElementById('auto_pose').checked;
    document.getElementById('settings-summary').innerHTML =
      autoPose
        ? `Auto Pose: <strong>ON</strong> (CdA will be adjusted according to slope: <span class="current-cda">0.40/0.32/0.28 m²</span> for climbs/flats/descents)`
        : `Auto Pose: <strong>OFF</strong> (CdA fixed at <span class="current-cda">${cda.toFixed(2)} m²</span>)`;
  }
  document.getElementById('auto_pose').onchange = updateSettingsSummary;
  document.getElementById('cda').oninput = updateSettingsSummary;
  updateSettingsSummary();

  document.getElementById('start-btn').onclick = () => {
    if (running) return;
    const user = {
      mode: document.getElementById('mode').value,
      rider_mass: parseFloat(document.getElementById('rider_mass').value),
      bike_mass: parseFloat(document.getElementById('bike_mass').value),
      cda: parseFloat(document.getElementById('cda').value),
      crr: parseFloat(document.getElementById('crr').value)
    };
    const useAutoPose = document.getElementById('auto_pose').checked;
    startSession(user, useAutoPose);
  };
  document.getElementById('stop-btn').onclick = () => {};

</script>
</body>
</html>
